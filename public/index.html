<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TodoFlow | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body data-page="app">
    <div class="page-shell">
      <div class="ambient ambient--one"></div>
      <div class="ambient ambient--two"></div>

      <header class="topbar">
        <div>
          <p class="eyebrow">Todo dashboard</p>
          <h1 class="brand">TodoFlow</h1>
        </div>

        <div class="topbar__actions">
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
            <span class="theme-toggle__track">
              <span class="theme-toggle__thumb"></span>
            </span>
            <span class="theme-toggle__label">Theme</span>
          </button>

          <a class="button button--ghost" id="logoutButton" href="/login">Back to Login</a>
        </div>
      </header>

      <main class="dashboard-grid">
        <section class="glass-card composer-card">
          <div class="section-heading">
            <p class="eyebrow">Create task</p>
            <h2 id="formTitle">Add a new todo</h2>
            <p>Every action on this screen is powered by the Express REST API.</p>
          </div>

          <form id="todoForm" class="todo-form">
            <input id="todoId" name="todoId" type="hidden" />

            <label class="field">
              <span>Title</span>
              <input id="title" name="title" type="text" placeholder="Ship the next feature" maxlength="80" required />
            </label>

            <label class="field">
              <span>Description</span>
              <textarea
                id="description"
                name="description"
                rows="5"
                placeholder="Add useful context, acceptance notes, or reminders"
                maxlength="220"
              ></textarea>
            </label>

            <div class="form-actions">
              <button class="button button--primary" id="submitButton" type="submit">Add Todo</button>
              <button class="button button--secondary" id="cancelEditButton" type="button" hidden>Cancel Edit</button>
            </div>
          </form>

          <p id="appMessage" class="status-message" aria-live="polite"></p>
        </section>

        <section class="glass-card todo-panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Your tasks</p>
              <h2>Todo list</h2>
            </div>
            <div class="stats-pill" id="todoStats">0 items</div>
          </div>

          <div id="todoList" class="todo-list"></div>
        </section>
      </main>
    </div>

    <script src="/js/app.js" defer></script>
  </body>
  </html>
